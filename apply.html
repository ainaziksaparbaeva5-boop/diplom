<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подача заявки | КНУ Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="db.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 40px 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eaeef2;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1a1a2e;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #e0e4e8;
        }
        .radio-option.selected {
            border-color: #667eea;
            background: #f0f3ff;
        }
        .radio-option input {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }
        .radio-option strong {
            font-size: 16px;
        }
        .radio-option small {
            color: #666;
            margin-left: 6px;
        }
        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
        }
        .file-upload {
            border: 1px dashed #667eea;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-upload:hover {
            background: #eef2ff;
        }
        .file-upload input {
            display: none;
        }
        .file-name {
            font-size: 14px;
            color: #667eea;
            margin-top: 8px;
            display: block;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #eaeef2;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📝 Подача заявки</h1>
    <div class="subtitle">Заполните информацию для участия в программе</div>

    <form id="applicationForm">
        <div class="form-group">
            <label>Выберите программу</label>
            <div id="programsList" class="radio-group"></div>
        </div>

        <div class="form-group">
            <label>Средний балл (GPA)</label>
            <input type="number" step="0.01" id="gpa" placeholder="3.5" required>
        </div>

        <div class="form-group">
            <label>Паспорт</label>
            <div class="file-upload" onclick="document.getElementById('passportFile').click()">
                📎 Загрузите скан паспорта
                <input type="file" id="passportFile" accept=".pdf,.jpg,.png" onchange="updateFileName(this, 'passportName')">
                <span id="passportName" class="file-name"></span>
            </div>
        </div>

        <div class="form-group">
            <label>Транскрипт</label>
            <div class="file-upload" onclick="document.getElementById('transcriptFile').click()">
                📎 Загрузите транскрипт
                <input type="file" id="transcriptFile" accept=".pdf,.jpg,.png" onchange="updateFileName(this, 'transcriptName')">
                <span id="transcriptName" class="file-name"></span>
            </div>
        </div>

        <div class="form-group">
            <label>Мотивационное письмо</label>
            <div class="file-upload" onclick="document.getElementById('motivationFile').click()">
                📎 Загрузите мотивационное письмо
                <input type="file" id="motivationFile" accept=".pdf,.doc,.docx" onchange="updateFileName(this, 'motivationName')">
                <span id="motivationName" class="file-name"></span>
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <button type="submit">Отправить заявку</button>
    </form>
</div>

<script>
    function updateFileName(input, spanId) {
        const span = document.getElementById(spanId);
        if (input.files && input.files[0]) {
            span.textContent = input.files[0].name;
        } else {
            span.textContent = '';
        }
    }

    // Загрузка списка программ (статические данные, можно из db.js)
    const programs = [
        { id: 1, name: "Erasmus+", country: "Германия" },
        { id: 2, name: "Academic Mobility", country: "Турция" },
        { id: 3, name: "Летняя стажировка", country: "Южная Корея" },
        { id: 4, name: "Study in Japan", country: "Япония" }
    ];

    const container = document.getElementById('programsList');
    container.innerHTML = '';
    programs.forEach(prog => {
        const div = document.createElement('div');
        div.className = 'radio-option';
        div.innerHTML = `
            <input type="radio" name="program" value="${prog.name}" id="prog_${prog.id}">
            <label for="prog_${prog.id}" style="flex:1; cursor:pointer;">
                <strong>${prog.name}</strong> <small>${prog.country}</small>
            </label>
        `;
        const radio = div.querySelector('input');
        radio.addEventListener('change', () => {
            document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
            if (radio.checked) div.classList.add('selected');
        });
        container.appendChild(div);
    });

    // Отправка формы
    document.getElementById('applicationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = '';

        const selectedRadio = document.querySelector('input[name="program"]:checked');
        if (!selectedRadio) {
            errorDiv.textContent = 'Выберите программу';
            return;
        }
        const programName = selectedRadio.value;

        const gpa = parseFloat(document.getElementById('gpa').value);
        if (isNaN(gpa) || gpa < 0 || gpa > 4) {
            errorDiv.textContent = 'Введите корректный GPA (0.0 – 4.0)';
            return;
        }

        const passportFile = document.getElementById('passportFile').files[0];
        const transcriptFile = document.getElementById('transcriptFile').files[0];
        if (!passportFile || !transcriptFile) {
            errorDiv.textContent = 'Загрузите скан паспорта и транскрипт';
            return;
        }

        // Проверяем авторизацию через db.js
        if (typeof db === 'undefined') {
            errorDiv.textContent = 'Ошибка: db.js не загружен. Проверьте подключение.';
            return;
        }
        const user = db.getCurrentUser();
        if (!user) {
            errorDiv.textContent = 'Вы не авторизованы. Пожалуйста, войдите.';
            setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            return;
        }

        const motivationFile = document.getElementById('motivationFile').files[0];

        const applicationData = {
            program: programName,
            gpa: gpa,
            languageLevel: '',   // можно добавить поле, но на скриншоте его нет
            motivationText: '',  // если нужно поле текст, добавьте, но сейчас только файл
            documents: {
                passport: passportFile.name,
                transcript: transcriptFile.name,
                motivation: motivationFile ? motivationFile.name : ''
            }
        };

        try {
            await db.saveApplication(applicationData);
            alert('✅ Заявка отправлена!');
            window.location.href = 'dashboard.html';
        } catch (err) {
            errorDiv.textContent = 'Ошибка: ' + err.message;
        }
    });
</script>
</body>
</html>
