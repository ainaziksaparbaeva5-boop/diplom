<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подача заявки | КНУ Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="db.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f1f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(10,15,31,0.8);
            backdrop-filter: blur(20px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .nav a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            transition: 0.3s;
        }
        .nav a:hover {
            background: #667eea;
            color: white;
        }
        .form-container {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 2rem;
        }
        .form-card {
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
        }
        h2 {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: rgba(255,255,255,0.6);
            margin-bottom: 2rem;
            padding-left: 1rem;
            border-left: 3px solid #667eea;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            margin-bottom: 0.5rem;
        }
        .form-group label i {
            color: #667eea;
            margin-right: 8px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .file-input {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .file-input button {
            background: rgba(102,126,234,0.2);
            border: 1px solid #667eea;
            border-radius: 30px;
            padding: 8px 15px;
            color: white;
            cursor: pointer;
            width: fit-content;
            transition: 0.3s;
        }
        .file-input button:hover {
            background: #667eea;
        }
        .file-name {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            word-break: break-all;
        }
        .programs-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }
        .program-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .program-option:hover {
            background: rgba(102,126,234,0.1);
            border-color: #667eea;
        }
        .program-option.selected {
            background: rgba(102,126,234,0.2);
            border-color: #667eea;
        }
        .program-option input {
            width: auto;
            margin-right: 10px;
            accent-color: #667eea;
        }
        .btn-submit {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        .footer {
            background: rgba(0,0,0,0.5);
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
        }
        @media (max-width: 700px) {
            h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">🌍 КНУ Exchange</div>
    <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="programs.html">Программы</a>
        <a href="language-test.html">Тест языка</a>
        <a href="apply.html">Подать заявку</a>
        <a href="dashboard.html">Кабинет</a>
        <a href="login.html">Вход</a>
    </nav>
</header>

<section class="form-container">
    <div class="form-card">
        <h2><i class="fas fa-paper-plane"></i> Подача заявки</h2>
        <div class="subtitle">Заполните информацию и прикрепите необходимые документы</div>

        <form id="applicationForm">
            <div class="form-group">
                <label><i class="fas fa-university"></i> Выберите программу</label>
                <div id="programsList" class="programs-list"></div>
                <input type="hidden" id="selectedProgramName" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-calculator"></i> Средний балл (GPA)</label>
                <input type="number" step="0.01" id="gpa" placeholder="3.5" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-language"></i> Уровень языка</label>
                <select id="languageLevel" required>
                    <option value="">Выберите уровень</option>
                    <option value="A2">A2 (базовый)</option>
                    <option value="B1">B1 (средний)</option>
                    <option value="B2">B2 (выше среднего)</option>
                    <option value="C1">C1 (продвинутый)</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Мотивационное письмо (текст)</label>
                <textarea id="motivationText" rows="5" placeholder="Расскажите о себе, почему вы хотите участвовать в программе..."></textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-passport"></i> Скан паспорта</label>
                <div class="file-input">
                    <button type="button" onclick="document.getElementById('passportFile').click()">Выбрать файл</button>
                    <input type="file" id="passportFile" accept=".pdf,.jpg,.png" style="display:none" onchange="updateFileName(this, 'passportName')">
                    <span id="passportName" class="file-name">Файл не выбран</span>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-scroll"></i> Транскрипт (выписка оценок)</label>
                <div class="file-input">
                    <button type="button" onclick="document.getElementById('transcriptFile').click()">Выбрать файл</button>
                    <input type="file" id="transcriptFile" accept=".pdf,.jpg,.png" style="display:none" onchange="updateFileName(this, 'transcriptName')">
                    <span id="transcriptName" class="file-name">Файл не выбран</span>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-heart"></i> Мотивационное письмо (файл, если есть)</label>
                <div class="file-input">
                    <button type="button" onclick="document.getElementById('motivationFile').click()">Выбрать файл</button>
                    <input type="file" id="motivationFile" accept=".pdf,.doc,.docx" style="display:none" onchange="updateFileName(this, 'motivationFileName')">
                    <span id="motivationFileName" class="file-name">Файл не выбран</span>
                </div>
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-send"></i> Отправить заявку</button>
        </form>
    </div>
</section>

<footer class="footer">
    <p>© 2026 КНУ Exchange | <a href="mailto:info@knu.kg">info@knu.kg</a></p>
</footer>

<script>
    function updateFileName(input, spanId) {
        const span = document.getElementById(spanId);
        if (input.files && input.files[0]) {
            span.textContent = input.files[0].name;
        } else {
            span.textContent = 'Файл не выбран';
        }
    }

    // Загрузка списка программ
    document.addEventListener('DOMContentLoaded', async () => {
        if (typeof db === 'undefined') {
            alert('Ошибка: db.js не загружен. Проверьте подключение файла.');
            return;
        }

        let programs = [];
        if (db.getAllPrograms) {
            programs = db.getAllPrograms();
        } else {
            programs = [
                { id: 1, name: "Erasmus+", country: "Германия", icon: "🇩🇪" },
                { id: 2, name: "Academic Mobility", country: "Турция", icon: "🇹🇷" },
                { id: 3, name: "Летняя стажировка", country: "Корея", icon: "🇰🇷" },
                { id: 4, name: "Обмен в Казахстане", country: "Казахстан", icon: "🇰🇿" },
                { id: 5, name: "Стажировка в Китае", country: "Китай", icon: "🇨🇳" },
                { id: 6, name: "Study in Japan", country: "Япония", icon: "🇯🇵" },
                { id: 7, name: "Обучение в Москве", country: "Россия", icon: "🇷🇺" },
                { id: 8, name: "Наука в Новосибирске", country: "Россия", icon: "🇷🇺" }
            ];
        }

        const container = document.getElementById('programsList');
        container.innerHTML = '';
        programs.forEach(prog => {
            const div = document.createElement('div');
            div.className = 'program-option';
            div.innerHTML = `
                <input type="radio" name="program" value="${prog.name}" id="prog_${prog.id}">
                <label for="prog_${prog.id}" style="flex:1; cursor:pointer;">
                    <strong>${prog.icon} ${prog.name}</strong> <small>(${prog.country})</small>
                </label>
            `;
            const radio = div.querySelector('input');
            radio.addEventListener('change', () => {
                if (radio.checked) {
                    document.getElementById('selectedProgramName').value = prog.name;
                    document.querySelectorAll('.program-option').forEach(opt => opt.classList.remove('selected'));
                    div.classList.add('selected');
                }
            });
            container.appendChild(div);
        });

        // Автозаполнение уровня языка
        if (db.getLatestTestResult) {
            const testResult = await db.getLatestTestResult();
            if (testResult && testResult.level) {
                const levelSelect = document.getElementById('languageLevel');
                if (levelSelect) levelSelect.value = testResult.level;
            }
        }
    });

    // Отправка заявки
    document.getElementById('applicationForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const user = db.getCurrentUser();
        if (!user) {
            if (confirm('❌ Для подачи заявки нужно войти. Перейти на страницу входа?')) {
                window.location.href = 'login.html';
            }
            return;
        }

        const programName = document.getElementById('selectedProgramName').value;
        const gpa = parseFloat(document.getElementById('gpa').value);
        const languageLevel = document.getElementById('languageLevel').value;
        const motivationText = document.getElementById('motivationText').value;

        // Собираем имена файлов (сами файлы не сохраняем, только имена)
        const passportFile = document.getElementById('passportFile').files[0];
        const transcriptFile = document.getElementById('transcriptFile').files[0];
        const motivationFile = document.getElementById('motivationFile').files[0];

        if (!programName) {
            alert('Пожалуйста, выберите программу');
            return;
        }
        if (isNaN(gpa) || gpa < 0 || gpa > 4) {
            alert('Введите корректный GPA (0.0 – 4.0)');
            return;
        }
        if (!languageLevel) {
            alert('Выберите уровень языка');
            return;
        }
        // Проверяем, что выбраны обязательные файлы (паспорт и транскрипт)
        if (!passportFile || !transcriptFile) {
            alert('Пожалуйста, прикрепите скан паспорта и транскрипт');
            return;
        }

        // Подготавливаем данные для сохранения
        const applicationData = {
            program: programName,
            gpa: gpa,
            languageLevel: languageLevel,
            motivationText: motivationText || '',
            documents: {
                passport: passportFile.name,
                transcript: transcriptFile.name,
                motivation: motivationFile ? motivationFile.name : ''
            }
        };

        try {
            await db.saveApplication(applicationData);
            alert('✅ Заявка успешно отправлена! Документы прикреплены.');
            window.location.href = 'dashboard.html';
        } catch (err) {
            alert('❌ Ошибка при отправке: ' + err.message);
        }
    });
</script>
</body>
</html>
