<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подача заявки | КНУ Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="db.js"></script>
    <style>
        /* Добавляем стили для формы, чтобы она вписалась в общий дизайн */
        .apply-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .apply-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 2rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #667eea;
        }
        .subtitle {
            color: rgba(255,255,255,0.6);
            margin-bottom: 2rem;
            padding-left: 1rem;
            border-left: 3px solid #667eea;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            margin-bottom: 0.5rem;
        }
        .form-group label i {
            color: #667eea;
            margin-right: 8px;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .radio-option:hover {
            background: rgba(102,126,234,0.1);
            border-color: #667eea;
        }
        .radio-option.selected {
            background: rgba(102,126,234,0.2);
            border-color: #667eea;
        }
        .radio-option input {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }
        .radio-option strong {
            font-size: 1rem;
        }
        .radio-option small {
            color: rgba(255,255,255,0.5);
            margin-left: 6px;
        }
        input[type="number"], select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
        }
        .file-upload {
            border: 1px dashed #667eea;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            background: rgba(255,255,255,0.02);
            cursor: pointer;
            transition: 0.2s;
        }
        .file-upload:hover {
            background: rgba(102,126,234,0.05);
            border-color: #667eea;
        }
        .file-upload i {
            font-size: 1.5rem;
            color: #667eea;
            margin-bottom: 5px;
        }
        .file-upload input {
            display: none;
        }
        .file-name {
            font-size: 0.8rem;
            color: #667eea;
            margin-top: 8px;
        }
        .btn-submit {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        .error-message {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
        }
        hr {
            margin: 20px 0;
            border-color: rgba(255,255,255,0.05);
        }
        .footer {
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">🌍 КНУ Exchange</div>
    <nav class="nav">
        <a href="index.html"><i class="fas fa-home"></i> Главная</a>
        <a href="programs.html"><i class="fas fa-book"></i> Программы</a>
        <a href="language-test.html"><i class="fas fa-language"></i> Тест языка</a>
        <a href="apply.html"><i class="fas fa-paper-plane"></i> Подать заявку</a>
        <a href="dashboard.html"><i class="fas fa-user"></i> Кабинет</a>
        <a href="login.html"><i class="fas fa-sign-in-alt"></i> Вход</a>
    </nav>
</header>

<div class="apply-container">
    <div class="apply-card">
        <h1><i class="fas fa-paper-plane"></i> Подача заявки</h1>
        <div class="subtitle">Заполните информацию для участия в программе</div>

        <form id="applicationForm">
            <div class="form-group">
                <label><i class="fas fa-university"></i> Выберите программу</label>
                <div id="programsList" class="radio-group"></div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-calculator"></i> Средний балл (GPA)</label>
                <input type="number" step="0.01" id="gpa" placeholder="3.5" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-passport"></i> Паспорт</label>
                <div class="file-upload" onclick="document.getElementById('passportFile').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <div>Загрузите скан паспорта</div>
                    <input type="file" id="passportFile" accept=".pdf,.jpg,.png" onchange="updateFileName(this, 'passportName')">
                    <span id="passportName" class="file-name"></span>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-scroll"></i> Транскрипт</label>
                <div class="file-upload" onclick="document.getElementById('transcriptFile').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <div>Загрузите транскрипт</div>
                    <input type="file" id="transcriptFile" accept=".pdf,.jpg,.png" onchange="updateFileName(this, 'transcriptName')">
                    <span id="transcriptName" class="file-name"></span>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-heart"></i> Мотивационное письмо</label>
                <div class="file-upload" onclick="document.getElementById('motivationFile').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <div>Загрузите мотивационное письмо</div>
                    <input type="file" id="motivationFile" accept=".pdf,.doc,.docx" onchange="updateFileName(this, 'motivationName')">
                    <span id="motivationName" class="file-name"></span>
                </div>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <button type="submit" class="btn-submit"><i class="fas fa-send"></i> Отправить заявку</button>
        </form>
    </div>
</div>

<footer class="footer">
    <p>© 2026 КНУ Exchange | <a href="mailto:info@knu.kg">info@knu.kg</a></p>
</footer>

<script>
    function updateFileName(input, spanId) {
        const span = document.getElementById(spanId);
        if (input.files && input.files[0]) {
            span.textContent = input.files[0].name;
        } else {
            span.textContent = '';
        }
    }

    // Список программ (можно взять из db, но для простоты оставим здесь)
    const programs = [
        { id: 1, name: "Erasmus+", country: "Германия", icon: "🇩🇪" },
        { id: 2, name: "Academic Mobility", country: "Турция", icon: "🇹🇷" },
        { id: 3, name: "Летняя стажировка", country: "Южная Корея", icon: "🇰🇷" },
        { id: 4, name: "Study in Japan", country: "Япония", icon: "🇯🇵" }
    ];

    const container = document.getElementById('programsList');
    container.innerHTML = '';
    programs.forEach(prog => {
        const div = document.createElement('div');
        div.className = 'radio-option';
        div.innerHTML = `
            <input type="radio" name="program" value="${prog.name}" id="prog_${prog.id}">
            <label for="prog_${prog.id}" style="flex:1; cursor:pointer;">
                <strong>${prog.icon} ${prog.name}</strong> <small>(${prog.country})</small>
            </label>
        `;
        const radio = div.querySelector('input');
        radio.addEventListener('change', () => {
            document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
            if (radio.checked) div.classList.add('selected');
        });
        container.appendChild(div);
    });

    document.getElementById('applicationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = '';

        const selectedRadio = document.querySelector('input[name="program"]:checked');
        if (!selectedRadio) {
            errorDiv.textContent = '❌ Выберите программу';
            return;
        }
        const programName = selectedRadio.value;

        const gpa = parseFloat(document.getElementById('gpa').value);
        if (isNaN(gpa) || gpa < 0 || gpa > 4) {
            errorDiv.textContent = '❌ Введите корректный GPA (0.0 – 4.0)';
            return;
        }

        const passportFile = document.getElementById('passportFile').files[0];
        const transcriptFile = document.getElementById('transcriptFile').files[0];
        if (!passportFile || !transcriptFile) {
            errorDiv.textContent = '❌ Загрузите скан паспорта и транскрипт';
            return;
        }

        if (typeof db === 'undefined') {
            errorDiv.textContent = '❌ Ошибка: db.js не загружен. Проверьте подключение.';
            return;
        }
        const user = db.getCurrentUser();
        if (!user) {
            errorDiv.textContent = '❌ Вы не авторизованы. Перенаправление на страницу входа...';
            setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            return;
        }

        const motivationFile = document.getElementById('motivationFile').files[0];

        const applicationData = {
            program: programName,
            gpa: gpa,
            languageLevel: '',
            motivationText: '',
            documents: {
                passport: passportFile.name,
                transcript: transcriptFile.name,
                motivation: motivationFile ? motivationFile.name : ''
            }
        };

        try {
            await db.saveApplication(applicationData);
            alert('✅ Заявка успешно отправлена!');
            window.location.href = 'dashboard.html';
        } catch (err) {
            errorDiv.textContent = '❌ Ошибка: ' + err.message;
        }
    });
</script>
</body>
</html>
